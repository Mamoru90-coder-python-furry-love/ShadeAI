<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>ShadeAI — BertViz вигляд attention</title>
<style>
body{background:#0d1117;color:#e6edf3;font:14px system-ui,'Segoe UI',sans-serif;margin:0;padding:16px}
a{color:#58a6ff}
h1{font-size:17px}
.sub{color:#8b949e;font-size:12.5px;margin:6px 0}
#bertviz-div{background:#fff;border-radius:10px;padding:16px;min-height:620px;color:#111}
select{background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:4px 8px;font-size:13px}
</style>
</head>
<body>
<a href="/">&#8592; назад в дашборд</a>
<h1>BertViz — attention між токенами (готовий вигляд, реальні дані ShadeAI)</h1>
<div class="sub">Зліва — токени-запити, справа — токени-ключі · товщина лінії = сила attention · наведи на токен — підсвітяться його зв'язки · вибери блок мережі зверху</div>
<div style="margin:10px 0">Блок мережі: <select id="layerSel"></select></div>
<div id="bertviz-div"><div id="vis"></div></div>
<script src="require.min.js"></script>
<script>
const LAYERS=8;
const sel=document.getElementById("layerSel");
for(let i=0;i<LAYERS;i++){const o=document.createElement("option");o.value=i;o.textContent="блок "+i+" (attention)";if(i===LAYERS-1)o.selected=true;sel.appendChild(o);}
function loadView(layer){
  fetch("state.json",{cache:"no-store"}).then(r=>r.json()).then(S=>{
    const tokens=S.attn_labels||[];
    const attention=(S.attn_flow||[]).map(m=>[m.map(row=>row.map(v=>v/255))]);
    if(!tokens.length||!attention.length){document.getElementById("vis").textContent="нема даних — запусти тренування з --dashboard";return;}
    const params={
      attention:[{name:null,attn:attention,left_text:tokens,right_text:tokens}],
      default_filter:"0",
      root_div_id:"bertviz-div",
      layer:layer,
      heads:[0],
      include_layers:Array.from({length:LAYERS},(_,i)=>i)
    };
    document.getElementById("bertviz-div").innerHTML='<div id="vis"></div>';
    fetch("head_view.js",{cache:"no-store"}).then(r=>r.text()).then(js=>{
      const real=js
        .replace("https://cdnjs.cloudflare.com/ajax/libs/d3/5.7.0/d3.min","d3.min")
        .replace("https://cdnjs.cloudflare.com/ajax/libs/jquery/2.0.0/jquery.min","jquery.min")
        .replace("PYTHON_PARAMS",JSON.stringify(params));
      window.eval(real);
    });
  });
}
sel.onchange=()=>loadView(+sel.value);
loadView(7);
</script>
</body>
</html>
